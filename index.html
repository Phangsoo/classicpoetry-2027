<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5f0"><title>2027 수능 고전시 주제 학습</title>
<style>
:root{font-family:Pretendard,'Noto Sans KR','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:#25302f;background:#f7f5f0}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 18px}.wrap{width:min(100%,760px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}.brand{font-size:12px;letter-spacing:.16em;font-weight:800;color:#608077}.count{color:#697a76;font-size:14px;font-weight:650}.track{height:5px;border-radius:40px;background:#e2e6de;overflow:hidden;margin-bottom:23px}.fill{height:100%;background:#4b7567;width:0%;transition:width .3s}.panel{min-height:490px;background:#fff;border:1px solid #eaece5;border-radius:25px;box-shadow:0 20px 65px rgba(33,49,43,.07);padding:55px 42px 42px;display:flex;flex-direction:column;align-items:center;text-align:center}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.06em;color:#5f8578;margin-bottom:20px}.prompt{font-size:clamp(18px,3.4vw,24px);font-weight:650;line-height:1.5;color:#4f625b;margin:0 0 52px}.work{font-size:clamp(25px,5.2vw,42px);letter-spacing:-.055em;line-height:1.55;font-weight:800;word-break:keep-all;margin:auto 0}.answerHead{font-size:14px;letter-spacing:.12em;font-weight:750;color:#6c8e81;margin:3px 0 23px}.topic{font-size:clamp(24px,4.3vw,33px);line-height:1.65;font-weight:800;letter-spacing:-.035em;word-break:keep-all;margin:0}.quote{white-space:pre-wrap;font-size:clamp(14px,2.3vw,17px);font-weight:400;color:#7a817e;line-height:1.9;word-break:keep-all;margin:24px 0 0}.ref{font-size:13px;color:#9caaa3;margin-top:29px}.button{border:0;cursor:pointer;background:#3d6b5b;color:white;font-weight:760;font-size:17px;padding:19px 34px;border-radius:14px;min-height:59px;width:100%;transition:background .2s,transform .15s}.button:hover{background:#315a4d}.button:active{transform:scale(.99)}.bottom{margin-top:auto;padding-top:48px;width:100%}.secondary{display:block;margin:18px auto 0;border:0;background:none;color:#78857e;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}.hint{font-size:12px;margin-top:19px;color:#9aa5a0;text-align:center}.hidden{display:none!important}.finished h2{font-size:34px;margin:4px 0 14px}.finished p{color:#74837b;line-height:1.8}.finished .button{margin-top:38px}@media(max-width:520px){body{padding:18px 13px}.panel{padding:43px 23px 30px;min-height:500px;border-radius:21px}.prompt{margin-bottom:35px}.bottom{padding-top:42px}.top{margin:0 6px 15px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">2027 EBS · 고전시 주제 학습</div><div class="count" id="count" aria-live="polite"></div></header><div class="track"><div class="fill" id="fill"></div></div><section class="panel" aria-live="polite"><div id="question" style="display:flex;flex:1;flex-direction:column;align-items:center;width:100%"><div class="eyebrow">주제 떠올리기</div><h1 class="prompt">제목을 보고 주제를 떠올려 보세요</h1><div class="work" id="work"></div><div class="bottom"><button class="button" id="reveal">주제 확인하기</button></div></div><div id="answer" class="hidden" style="display:flex;flex:1;flex-direction:column;align-items:center;width:100%"><div class="answerHead">작품의 주제</div><div class="topic" id="topic"></div><div class="quote" id="quote"></div><div class="ref" id="ref"></div><div class="bottom"><button class="button" id="next">다음 작품 <span aria-hidden="true">→</span></button></div></div><div id="finished" class="finished hidden"><div class="eyebrow">학습 완료</div><h2>모든 작품을 확인했어요!</h2><p id="finishText"></p><button class="button" id="restart">다시 랜덤 학습하기 ↻</button></div></section><div class="hint">Enter / Space 키로도 다음 단계로 이동할 수 있습니다.</div></main>
<script>const works=[{"author": "미상", "title": "창밖에 가마솥 때우라는 장사", "topic": "임과의 이별을 극복할 수 없는 현실에 대한 한탄", "quote": "창밖에 가마솥 때우라는 장사 이별 나는 구멍도 때우는가?"}, {"author": "정훈", "title": "월곡답가", "topic": "자연 속에 은둔한 벗(월곡 우배선)을 예찬하고 (추모하는) 시", "quote": "이제도 옛사람 계시니 그가 내 벗인가 하노라\n세상의 어지러운 일들 듣도 보도 마사이다"}, {"author": "송순", "title": "면앙정가", "topic": "면앙정 주위의 아름다운 풍경과 자연 속에서 살아가는 만족감", "quote": "정자를 얹었는데 구름 탄 청학이\n천리를 가리라 두 날개 벌였는 듯"}, {"author": "미상", "title": "사친가", "topic": "돌아가신 부모님에 대한 간절한 그리움", "quote": "서늘한 바람 적막하고 소식이 영영 끊기니\n슬프다 우리 부모 대보름인 줄 모르시나"}, {"author": "미상", "title": "몽금포 타령", "topic": "어촌 생활 속에서 드러나는 임에 대한 그리움과 재회의 소망", "quote": "가는 임 야속타 속태우지 말고요\n갔다가 올 때가 더 반갑답니다"}, {"author": "이중경", "title": "어부별곡", "topic": "세속적 삶에 대한 반성과 자연 속에서 느끼는 만족감", "quote": "처음에 잘못 생각하여 시서를 일삼도다\n중간에 망령되어 명리를 바라도다\n물외의 풍월강산이 내 분수인가 하노라"}, {"author": "미상", "title": "유산가", "topic": "봄날의 아름다운 경치 속에서 풍류를 즐기는 흥취", "quote": "때 좋다 벗님네야 산천경개 구경 가세\n소부 허유 문답하던 기산 영수가 예 아니냐"}, {"author": "신교", "title": "백석정별곡", "topic": "백석정의 아름다운 경치 속에서 풍류를 즐기는 흥취", "quote": "소쇄한 정자 속에 매화와 학으로 벗을 삼아\n연하에 병이 들어 백 년을 지내오니\n있으나 없으나 세사도 나 몰라라"}, {"author": "미상", "title": "합강정가", "topic": "관리들의 호화로운 뱃놀이 비판과 고통받는 백성들의 모습 고발", "quote": "순시 나온 우리 감사 이날에 뱃놀이하니\n오리 밖 기화정에 술과 고기 낭자하네\n여러 고을 관리가 대접한 것이라 백성의 피와 기름 아닌가"}, {"author": "미상", "title": "계녀가", "topic": "시집가는 딸에게 어머니가 부녀자의 예의범절을 교육하는 내용", "quote": "아이야 들어 봐라 내일이 신행이라\n친정을 하직하고 시가로 들어가니\n부모께 떠날 적에 경계할 말 많고 많다"}, {"author": "허난설헌", "title": "규원가", "topic": "남편이 집을 나가 독수공방하는 여인의 원망과 그리움", "quote": "삼삼오오 야유원에 새 사람이 났단 말인가\n꽃 피고 날 저문 제 정처없이 나가 있어\n백마금편으로 어디어디 머무는고"}, {"author": "임유후", "title": "목동가", "topic": "사대부와 목동의 문답을 통한 삶의 방식에 대한 논쟁", "quote": "여관 같은 세상에 하루살이같이 나왔다가\n공명도 못 이루고 초목같이 썩어지면\n공산 백골이 그 아니 느꺼우냐"}, {"author": "이정", "title": "풍계육가", "topic": "속세와 거리를 두고 자연 속에 은거하여 풍류를 즐기는 흥취", "quote": "청풍을 좋이 여겨 창을 아니 닫았노라\n명월을 좋이 여겨 잠을 아니 들었노라"}, {"author": "윤선도", "title": "만흥", "topic": "속세와 거리를 두고 자연 속에 은거하여 풍류를 즐기는 흥취", "quote": "산수 간 바위 아래 띠집을 짓는다 하니\n그 모르는 남들은 웃는다 한다마는\n어리석은 촌놈의 뜻에는 그것이 내 분수인가 하노라"}, {"author": "미상", "title": "규수상사곡", "topic": "다른 사람의 아내가 된 여인에 대한 사랑의 고통과 그리움", "quote": "보고 싶네 보고 싶네 임의 얼굴 보고 싶네\n무심하다 저 여자야 가련하다 이내 청춘"}, {"author": "연안이씨", "title": "부여노정기", "topic": "아들의 부임 행차에 동행한 체험과 자부심", "quote": "충청도 부여 현감 임금이 결정하니\n어와 성은이야 갈수록 감축하다"}, {"author": "정극인", "title": "상춘곡", "topic": "아름다운 봄의 자연 속에서 풍류를 즐기는 흥취", "quote": "수풀에 우는 새는 봄기운을 못내 겨워 소리마다 교태로다\n물아일체러니, 흥이 다를쏘냐"}, {"author": "미상", "title": "베틀 노래", "topic": "베틀을 짜면서 부르는 민요.", "quote": "하늘에다 베틀 놓고 구름 속에 이매 걸어\n짜궁짜궁 짜아 내어 가지잎과 뭅거워라"}, {"author": "권섭", "title": "황강구곡가", "topic": "황강의 아름다운 자연 예찬과 도학 계승에 대한 의지", "quote": "삼곡은 어디매오 황강이 여기로다\n거문고 소리와 글 읽는 소리가 구재를 이었으니\n지금의 가을 달 정자 앞 강이 어제인 듯하구나"}, {"author": "미상", "title": "개야미 불개야미", "topic": "자신을 모함하는 말에 대한 경계와 결백 주장", "quote": "임아 임아 온 놈이 온 말을 하여도 임이 짐작하소서"}, {"author": "조위", "title": "만분가", "topic": "유배 생활에 대한 억울함과 임금을 그리는 변함없는 충정", "quote": "차라리 죽어서 억만 번 변화하여\n옥황상제 책상 앞에 나아 앉아\n가슴속 쌓인 말씀 실컷 사뢰리라"}];
const $=id=>document.getElementById(id);let order=[],cursor=0,mode='question';
function shuffle(){order=Array.from({length:works.length},(_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}
function show(id){for(const v of ['question','answer','finished'])$(v).classList.toggle('hidden',v!==id);}
function progress(){const completed=mode==='done'?works.length:cursor+(mode==='answer'?1:0);$('count').textContent=`${Math.min(completed,works.length)} / ${works.length} 작품`; $('fill').style.width=`${completed/works.length*100}%`;}
function question(){mode='question';const w=works[order[cursor]];$('work').textContent=`${w.author}, 「${w.title}」`;show('question');progress();}
function reveal(){if(mode!=='question')return;mode='answer';const w=works[order[cursor]];$('topic').textContent=w.topic;$('quote').textContent='“'+w.quote+'”';$('ref').textContent=`${w.author}, 「${w.title}」`;show('answer');$('next').innerHTML=cursor===works.length-1?'학습 마치기 <span aria-hidden="true">✓</span>':'다음 작품 <span aria-hidden="true">→</span>';progress();}
function next(){if(mode!=='answer')return;cursor++;if(cursor===works.length){mode='done';show('finished');$('finishText').textContent=`총 ${works.length}편의 고전시 주제를 모두 살펴봤습니다.`;progress()}else question();}
function restart(){shuffle();cursor=0;question()}
$('reveal').addEventListener('click',reveal);$('next').addEventListener('click',next);$('restart').addEventListener('click',restart);document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.code==='Space')&&!['BUTTON','INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();if(mode==='question')reveal();else if(mode==='answer')next();else restart();}});restart();</script></body></html>
